name: Validate synthetic platform
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.13.5'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.11.0', cache: npm, cache-dependency-path: apps/growth-console/package-lock.json}
      - run: make setup
      - run: make lint test test-e2e security
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.13.5'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.11.0'}
      - run: make setup
      - run: npm run build
        working-directory: apps/growth-console
      - name: Use the runner browser or install Playwright Chromium
        working-directory: apps/growth-console
        run: |
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: npm test
        working-directory: apps/growth-console
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: apps/growth-console/test-results/}
  durable-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.13.5'}
      - run: uv sync --frozen
      - run: uv run python scripts/bootstrap.py
      - run: docker compose up -d postgres temporal broker
      - run: make test-integration
      - run: docker compose logs --no-color > work/compose.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: durable-evidence, path: work/*.log}
      - run: docker compose down
        if: always()
