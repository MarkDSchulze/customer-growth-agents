[project]
name = "customer-growth-agents"
version = "0.1.0"
description = "Governed, vendor-neutral customer growth orchestration"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.16.1",
    "fastapi==0.162.4",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.8",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.8",
    "temporalio==1.36.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "openapi-spec-validator==0.9.0",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20261111",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, Temporal and Kafka", "e2e: synthetic workflow tests"]
