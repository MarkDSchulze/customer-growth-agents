image:
  repository: ghcr.io/markdschulze/customer-growth-agents
  tag: 0.2.0
  pullPolicy: IfNotPresent
existingSecret: growth-runtime
tlsSecret: ""
temporalNamespace: ""
serviceAccount:
  name: growth-runtime
  annotations: {}
region: us-east-1
config:
  GROWTH_RUNTIME_MODE: enterprise
  GROWTH_EXECUTION: temporal
  GROWTH_OIDC_ISSUER: https://identity.example.invalid
  GROWTH_OIDC_JWKS_URL: https://identity.example.invalid/.well-known/jwks.json
  GROWTH_OIDC_AUDIENCE: growth-api
  GROWTH_TEMPORAL_ADDRESS: temporal.example.invalid:7233
  GROWTH_TEMPORAL_TLS: 'true'
  GROWTH_KAFKA_SERVERS: broker.example.invalid:9098
  GROWTH_KAFKA_SECURITY_PROTOCOL: SASL_SSL
  GROWTH_KAFKA_SASL_MECHANISM: OAUTHBEARER
  GROWTH_WORKER_CONCURRENCY: '32'
  GROWTH_SOURCE_BINDINGS: '{}'
api:
  replicas: 3
worker:
  replicas: 3
resources:
  requests: {cpu: 250m, memory: 384Mi}
  limits: {cpu: '2', memory: 1Gi}
autoscaling:
  enabled: true
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
migration:
  enabled: false
network:
  ingressNamespace: ingress-nginx
  # Operator-supplied approved regional private-service and vendor egress CIDRs.
  allowedEgressCIDRs: []
  allowedEgressPorts: [443, 5432, 7233, 9098]
