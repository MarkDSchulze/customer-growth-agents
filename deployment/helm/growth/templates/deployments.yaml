{{- $root := . -}}
{{- range $component := list "api" "worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $component }}
  labels:
    app.kubernetes.io/part-of: customer-growth
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ if eq $component "api" }}{{ $root.Values.api.replicas }}{{ else }}{{ $root.Values.worker.replicas }}{{ end }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $root.Release.Name }}
        app.kubernetes.io/part-of: customer-growth
        app.kubernetes.io/component: {{ $component }}
        growth-region: {{ $root.Values.region }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/config.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ $root.Values.serviceAccount.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" $root.Values.image.repository $root.Values.image.tag | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if eq $component "api" }}
          command: [uvicorn, growth.api:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 30, periodSeconds: 5}
          {{- else }}
          command: [python, -m, growth.enterprise.worker]
          {{- end }}
          envFrom:
            - configMapRef: {name: {{ $root.Release.Name }}-runtime}
            - secretRef: {name: {{ $root.Values.existingSecret }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if $root.Values.tlsSecret }}
            - {name: tls, mountPath: /run/secrets/tls, readOnly: true}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        {{- if $root.Values.tlsSecret }}
        - name: tls
          secret: {secretName: {{ $root.Values.tlsSecret }}, defaultMode: 0440}
        {{- end }}
{{- end }}
