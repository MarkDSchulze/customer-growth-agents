{{- $root := . -}}
{{- range $component := list "api" "worker" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $root.Release.Name }}-{{ $component }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
{{- if $root.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $root.Release.Name }}-{{ $component }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $root.Release.Name }}-{{ $component }}}
  minReplicas: {{ if eq $component "api" }}{{ $root.Values.api.replicas }}{{ else }}{{ $root.Values.worker.replicas }}{{ end }}
  maxReplicas: {{ $root.Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $root.Values.autoscaling.targetCPUUtilizationPercentage }}}}
{{- end }}
{{- end }}
