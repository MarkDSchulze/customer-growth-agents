components:
  schemas:
    ActionIntent:
      additionalProperties: false
      properties:
        journeyId:
          default: cart-recovery-v1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
          title: Journeyid
          type: string
        purpose:
          const: cart_recovery
          default: cart_recovery
          title: Purpose
          type: string
        tool:
          const: trigger_approved_journey
          default: trigger_approved_journey
          title: Tool
          type: string
        workflowId:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
          title: Workflowid
          type: string
      required:
      - workflowId
      title: ActionIntent
      type: object
    ApprovalCommand:
      additionalProperties: false
      properties:
        decision:
          enum:
          - approved
          - rejected
          title: Decision
          type: string
      required:
      - decision
      title: ApprovalCommand
      type: object
    DecisionRequest:
      additionalProperties: false
      properties:
        purpose:
          const: cart_recovery
          default: cart_recovery
          title: Purpose
          type: string
        workflowId:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
          title: Workflowid
          type: string
      required:
      - workflowId
      title: DecisionRequest
      type: object
    Event:
      additionalProperties: false
      properties:
        aggregateId:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
          title: Aggregateid
          type: string
        correlationId:
          format: uuid
          title: Correlationid
          type: string
        data:
          additionalProperties: true
          title: Data
          type: object
        eventId:
          format: uuid
          title: Eventid
          type: string
        eventType:
          enum:
          - commerce.cart_abandoned.v1
          - commerce.order_placed.v1
          - service.case_escalated.v1
          - growth.action_executed.v1
          title: Eventtype
          type: string
        occurredAt:
          format: date-time
          title: Occurredat
          type: string
        region:
          const: us-east-1
          default: us-east-1
          title: Region
          type: string
        schemaVersion:
          const: 1.0.0
          default: 1.0.0
          title: Schemaversion
          type: string
        source:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
          title: Source
          type: string
        tenantId:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
          title: Tenantid
          type: string
      required:
      - eventId
      - eventType
      - tenantId
      - aggregateId
      - occurredAt
      - correlationId
      - source
      - data
      title: Event
      type: object
    FaultCommand:
      additionalProperties: false
      properties:
        mode:
          enum:
          - healthy
          - timeout_after_accept
          - unavailable
          - permanent
          - unknown_status
          title: Mode
          type: string
      required:
      - mode
      title: FaultCommand
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    KillCommand:
      additionalProperties: false
      properties:
        enabled:
          title: Enabled
          type: boolean
      required:
      - enabled
      title: KillCommand
      type: object
    Snapshot:
      additionalProperties: false
      properties:
        cartId:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
          title: Cartid
          type: string
        channel:
          const: email
          default: email
          title: Channel
          type: string
        consent:
          default: true
          title: Consent
          type: boolean
        customerRef:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
          title: Customerref
          type: string
        identityKnown:
          default: true
          title: Identityknown
          type: boolean
        inStock:
          default: true
          title: Instock
          type: boolean
        ordered:
          default: false
          title: Ordered
          type: boolean
        priceCurrent:
          default: true
          title: Pricecurrent
          type: boolean
        purposeAllowed:
          default: true
          title: Purposeallowed
          type: boolean
        severeCase:
          default: false
          title: Severecase
          type: boolean
        sourceAvailable:
          default: true
          title: Sourceavailable
          type: boolean
      required:
      - customerRef
      - cartId
      title: Snapshot
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
